name: Publish docs and R-Type WASM via GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs + R-Type WASM
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Cache CPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cpm_cache
          key: cpm-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            cpm-wasm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            wget \
            doxygen \
            graphviz

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Cache Lua WASM
        id: cache-lua
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/lua-wasm-install
          key: lua-wasm-v5.4.7-static-${{ runner.os }}

      - name: Build Lua 5.4 for WebAssembly
        if: steps.cache-lua.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p lua-build-src && cd lua-build-src

          # Download official Lua 5.4.7 source tarball
          curl -R -O https://www.lua.org/ftp/lua-5.4.7.tar.gz
          tar zxf lua-5.4.7.tar.gz
          cd lua-5.4.7

          mkdir -p "${{ github.workspace }}/lua-wasm-install/include"
          mkdir -p "${{ github.workspace }}/lua-wasm-install/lib"
          mkdir -p "${{ github.workspace }}/lua-wasm-install/lib/pkgconfig"

          # Compile each C source file explicitly using emcc in C mode (-x c).
          # Exclude lua.c and luac.c (the standalone interpreters) — we only need the static lib + headers.
          for src in lapi.c lauxlib.c lbaselib.c lcode.c lcorolib.c lctype.c ldblib.c ldump.c lfunc.c lgc.c linit.c liolib.c llex.c lmathlib.c lmem.c loadlib.c lobject.c lopcodes.c loslib.c lparser.c lstate.c lstring.c lstrlib.c ltable.c ltablib.c ltm.c lundump.c lutf8lib.c lvm.c lzio.c; do
            emcc -O2 -x c -c "$src" -I. -DLUA_USE_POSIX
          done

          emar rcs liblua.a *.o
          cp liblua.a "${{ github.workspace }}/lua-wasm-install/lib/"

          # Wrap Lua headers in extern "C" for C++ compatibility
          for header in lua.h luaconf.h lualib.h lauxlib.h; do
            echo '#ifdef __cplusplus' > "${{ github.workspace }}/lua-wasm-install/include/$header"
            echo 'extern "C" {' >> "${{ github.workspace }}/lua-wasm-install/include/$header"
            echo '#endif' >> "${{ github.workspace }}/lua-wasm-install/include/$header"
            cat "$header" >> "${{ github.workspace }}/lua-wasm-install/include/$header"
            echo '#ifdef __cplusplus' >> "${{ github.workspace }}/lua-wasm-install/include/$header"
            echo '}' >> "${{ github.workspace }}/lua-wasm-install/include/$header"
            echo '#endif' >> "${{ github.workspace }}/lua-wasm-install/include/$header"
          done

          # Generate a custom pkg-config .pc file so CMake finds the WASM build
          cat <<EOF > "${{ github.workspace }}/lua-wasm-install/lib/pkgconfig/lua5.4.pc"
          prefix=${{ github.workspace }}/lua-wasm-install
          exec_prefix=\${prefix}
          libdir=\${exec_prefix}/lib
          includedir=\${prefix}/include

          Name: Lua
          Description: An Extensible Programming Language (C library for C++ projects)
          Version: 5.4.7
          Libs: -L\${libdir} -llua -lm
          Cflags: -I\${includedir}
          EOF
          cp "${{ github.workspace }}/lua-wasm-install/lib/pkgconfig/lua5.4.pc" "${{ github.workspace }}/lua-wasm-install/lib/pkgconfig/lua.pc"

      - name: Stage WASM runtime files
        run: |
          set -euo pipefail
          ROOT="${{ github.workspace }}"
          PROJ="$ROOT/R-Type"
          STAGE="$PROJ/.wasm_stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          for rel in assets scripts Prefabs ui system project.json input.json; do
            if [ -e "$PROJ/$rel" ]; then
              mkdir -p "$STAGE/$(dirname "$rel")"
              cp -r "$PROJ/$rel" "$STAGE/$rel"
            fi
          done
          find "$PROJ" -maxdepth 1 -name '*.scene' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "$STAGE/"
          done
          mkdir -p "$STAGE/${ROOT#/}/UI/lua/templates"
          cp -r "$ROOT/UI/lua/templates/." "$STAGE/${ROOT#/}/UI/lua/templates/"

      - name: Configure WASM build
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="${{ github.workspace }}/lua-wasm-install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          emcmake cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-wasm" \
            -DEDITOR_BUILD=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build R-Type (WASM)
        run: cmake --build "${{ github.workspace }}/build-wasm" --target Game --parallel

      - name: Stage WASM outputs
        run: |
          set -euo pipefail
          ROOT="${{ github.workspace }}"
          BUILD="$ROOT/build-wasm"
          PROJ="$ROOT/R-Type"
          for name in index.js index.wasm index.data; do
            cp "$BUILD/$name" "$PROJ/$name"
          done

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r Documentation/requirements.txt

      - name: Build docs
        run: |
          cd Documentation
          mkdocs build

      - name: Add game to site
        run: |
          set -euo pipefail
          mkdir -p Documentation/site/game
          cp R-Type/index.html R-Type/index.js R-Type/index.wasm R-Type/index.data Documentation/site/game/
          cp CNAME Documentation/site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4