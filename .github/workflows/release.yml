name: Build Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm_cache
  BUILD_DIR: build
  DIST_DIR: dist

jobs:
  build-unix:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cpm_cache
          key: cpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            cpm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            liblua5.4-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libasound2-dev \
            libpulse-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkgconf lua@5.4
          lua_pc="$(brew --prefix lua@5.4)/lib/pkgconfig"
          echo "PKG_CONFIG_PATH=${lua_pc}${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="${lua_pc}${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          pkg-config --modversion lua5.4

      - name: Configure
        run: |
          set -euo pipefail
          args=(
            -S .
            -B "$BUILD_DIR"
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
          )

          if [ "$RUNNER_OS" = "macOS" ]; then
            args+=("-DCMAKE_BUILD_RPATH=@executable_path/../lib")
          else
            args+=("-DCMAKE_BUILD_RPATH=\$ORIGIN/../lib")
          fi

          cmake "${args[@]}"

      - name: Configure R-Type game
        run: |
          set -euo pipefail
          ROOT="${{ github.workspace }}"
          PROJ="$ROOT/R-Type"
          cmake -S "$ROOT" -B "$PROJ/build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DEDITOR_BUILD=ON

      - name: Build Engine and RTypeEditor
        run: cmake --build "$BUILD_DIR" --target Engine RTypeEditor --parallel

      - name: Build R-Type game
        run: cmake --build R-Type/build --parallel

      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          editor_pkg="RTypeEditor-${PLATFORM}"
          engine_pkg="Engine-${PLATFORM}"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR/$editor_pkg/bin" "$DIST_DIR/$editor_pkg/lib"
          mkdir -p "$DIST_DIR/$engine_pkg/lib" "$DIST_DIR/$engine_pkg/include"

          cp "$BUILD_DIR/RTypeEditor" "$DIST_DIR/$editor_pkg/bin/"
          cp "$BUILD_DIR/Engine/libEngine.a" "$DIST_DIR/$engine_pkg/lib/"
          cp -R Engine/include/. "$DIST_DIR/$engine_pkg/include/"

          if [ "$RUNNER_OS" = "macOS" ]; then
            packaged_exe="$DIST_DIR/$editor_pkg/bin/RTypeEditor"
            lua_ref="$(otool -L "$packaged_exe" | awk '/liblua.*\.dylib/ {print $1; exit}')"
            if [ -n "$lua_ref" ]; then
              lua_base="$(basename "$lua_ref")"
              if [ -f "$lua_ref" ]; then
                cp -L "$lua_ref" "$DIST_DIR/$editor_pkg/lib/$lua_base"
              else
                cp -L "$(pkg-config --variable=libdir lua5.4)/$lua_base" \
                  "$DIST_DIR/$editor_pkg/lib/$lua_base"
              fi
              install_name_tool -change "$lua_ref" \
                "@executable_path/../lib/$lua_base" "$packaged_exe"
            fi
            codesign --force --sign - "$packaged_exe"
          else
            lua_ref="$(ldd "$BUILD_DIR/RTypeEditor" | awk '/liblua/ {print $3; exit}')"
            if [ -n "$lua_ref" ]; then
              cp -L "$lua_ref" "$DIST_DIR/$editor_pkg/lib/$(basename "$lua_ref")"
            fi
          fi

          if [ -f "R-Type/build/Game" ]; then
            cp "R-Type/build/Game" "$DIST_DIR/$editor_pkg/bin/"
          fi

          tar -czf "$DIST_DIR/$editor_pkg.tar.gz" -C "$DIST_DIR" "$editor_pkg"
          tar -czf "$DIST_DIR/$engine_pkg.tar.gz" -C "$DIST_DIR" "$engine_pkg"
          ls -lh "$DIST_DIR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Attach archives to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.tar.gz

  build-windows:
    name: windows-x86_64
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cpm_cache
          key: cpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            cpm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-lua54

      - name: Stage Lua prefix
        run: |
          set -euo pipefail
          prefix="$PWD/.lua-prefix"
          mkdir -p "$prefix/include" "$prefix/lib" "$prefix/bin"
          cp -r /ucrt64/include/lua5.4/. "$prefix/include/"
          cp /ucrt64/lib/liblua5.4.dll.a "$prefix/lib/liblua54.dll.a"
          cp /ucrt64/bin/lua54.dll "$prefix/bin/"

      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLUA_PREFIX="$(cygpath -m "$PWD/.lua-prefix")"

      - name: Build Engine and RTypeEditor
        run: cmake --build "$BUILD_DIR" --target Engine RTypeEditor --parallel

      - name: Package
        env:
          PLATFORM: windows-x86_64
        run: |
          set -euo pipefail

          editor_pkg="RTypeEditor-${PLATFORM}"
          engine_pkg="Engine-${PLATFORM}"
          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR/$editor_pkg/bin" "$DIST_DIR/$editor_pkg/lib"
          mkdir -p "$DIST_DIR/$engine_pkg/lib" "$DIST_DIR/$engine_pkg/include"

          cp "$BUILD_DIR/RTypeEditor.exe" "$DIST_DIR/$editor_pkg/bin/"
          cp "$BUILD_DIR/Engine/libEngine.a" "$DIST_DIR/$engine_pkg/lib/"
          cp -R Engine/include/. "$DIST_DIR/$engine_pkg/include/"
          find "$BUILD_DIR" -maxdepth 1 -name '*.dll' -exec cp {} "$DIST_DIR/$editor_pkg/bin/" \;

          if [ -f "R-Type/build/Game.exe" ]; then
            cp "R-Type/build/Game.exe" "$DIST_DIR/$editor_pkg/bin/"
          fi

          (cd "$DIST_DIR" && cmake -E tar cf "$editor_pkg.zip" --format=zip "$editor_pkg")
          (cd "$DIST_DIR" && cmake -E tar cf "$engine_pkg.zip" --format=zip "$engine_pkg")
          ls -lh "$DIST_DIR"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach archives to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.zip

  build-wasm:
    name: r-type-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache CPM dependencies
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cpm_cache
          key: cpm-wasm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            cpm-wasm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            liblua5.4-dev

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Cache Lua WASM
        id: cache-lua
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/lua-wasm-install
          key: lua-wasm-v5.4.7-${{ runner.os }}

      - name: Build Lua for WebAssembly
        if: steps.cache-lua.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v5.4.7 https://github.com/walterschell/Lua.git lua-src
          cd lua-src
          mkdir build-wasm && cd build-wasm
          emcmake cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/lua-wasm-install"
          cmake --build . --parallel
          cmake --install .

      - name: Stage WASM runtime files
        run: |
          set -euo pipefail
          ROOT="${{ github.workspace }}"
          PROJ="$ROOT/R-Type"
          STAGE="$PROJ/.wasm_stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          for rel in assets scripts Prefabs ui system project.json input.json; do
            if [ -e "$PROJ/$rel" ]; then
              mkdir -p "$STAGE/$(dirname "$rel")"
              cp -r "$PROJ/$rel" "$STAGE/$rel"
            fi
          done
          find "$PROJ" -maxdepth 1 -name '*.scene' -print0 | while IFS= read -r -d '' f; do
            cp "$f" "$STAGE/"
          done
          mkdir -p "$STAGE/${ROOT#/}/UI/lua/templates"
          cp -r "$ROOT/UI/lua/templates/." "$STAGE/${ROOT#/}/UI/lua/templates/"

      - name: Configure WASM build
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="${{ github.workspace }}/lua-wasm-install/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          emcmake cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-wasm" \
            -DEDITOR_BUILD=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build R-Type (WASM)
        run: cmake --build "${{ github.workspace }}/build-wasm" --target Game --parallel

      - name: Stage WASM outputs
        run: |
          set -euo pipefail
          ROOT="${{ github.workspace }}"
          BUILD="$ROOT/build-wasm"
          PROJ="$ROOT/R-Type"
          for name in index.js index.wasm index.data; do
            cp "$BUILD/$name" "$PROJ/$name"
          done

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-type-wasm
          path: |
            R-Type/index.html
            R-Type/index.js
            R-Type/index.wasm
            R-Type/index.data
          if-no-files-found: error

      - name: Package WASM bundle
        run: |
          set -euo pipefail
          cd R-Type
          zip -r ../r-type-wasm.zip index.html index.js index.wasm index.data

      - name: Attach WASM bundle to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: r-type-wasm.zip

  deploy-pages:
    name: Deploy docs + R-Type WASM to GitHub Pages
    needs: build-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: r-type-wasm
          path: R-Type

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            doxygen graphviz python3-pip

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r Documentation/requirements.txt

      - name: Build docs
        run: |
          cd Documentation
          mkdocs build

      - name: Add game to site
        run: |
          set -euo pipefail
          mkdir -p Documentation/site/game
          cp R-Type/index.html R-Type/index.js R-Type/index.wasm R-Type/index.data Documentation/site/game/
          cp CNAME Documentation/site/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Documentation/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4