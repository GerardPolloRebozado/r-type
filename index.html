<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>RType Editor</title>
    <style>
        html, body {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          background: #101014;
          color: #e6e6e6;
          font-family: system-ui, sans-serif;
        }

        #app {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        #canvas {
          display: block;
          max-width: 100%;
          max-height: 100%;
          background: #000;
          outline: none;
          touch-action: none;
        }

        #overlay {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.75rem;
          padding: 1.5rem;
          text-align: center;
          background: rgba(16, 16, 20, 0.92);
        }

        #overlay[hidden] {
          display: none;
        }

        #overlay h1 {
          margin: 0;
          font-size: 1.25rem;
          font-weight: 600;
        }

        #status {
          margin: 0;
          color: #a9a9b3;
          font-size: 0.95rem;
        }

        #error {
          max-width: 52rem;
          margin: 0;
          padding: 1rem;
          border: 1px solid #5a2a2a;
          border-radius: 0.5rem;
          background: #2a1414;
          color: #ffb4b4;
          font-family: ui-monospace, monospace;
          font-size: 0.8rem;
          line-height: 1.5;
          text-align: left;
          white-space: pre-wrap;
        }

        #error[hidden] {
          display: none;
        }

        code {
          color: #f0d58c;
        }
    </style>
</head>
<body>
<div id="app">
    <canvas id="canvas" tabindex="-1"></canvas>
</div>

<div id="overlay">
    <h1>RType Editor</h1>
    <p id="status">Loading WebAssembly build...</p>
    <pre id="error" hidden></pre>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const overlay = document.getElementById("overlay");
    const status = document.getElementById("status");
    const errorBox = document.getElementById("error");

    function showError(message) {
      status.textContent = "Unable to start RTypeEditor.";
      errorBox.textContent = message;
      errorBox.hidden = false;
      overlay.hidden = false;
    }

    window.showError = showError;

    window.Module = {
      canvas: canvas,

      locateFile: function (path) {
        return "build-wasm/" + path;
      },

      print: function (text) {
        console.log(text);
      },

      printErr: function (text) {
        console.error(text);
      },

      setStatus: function (text) {
        if (text) {
          status.textContent = text;
          overlay.hidden = false;
        }
      },

      onRuntimeInitialized: function () {
        overlay.hidden = true;
        canvas.focus();
      },

      onAbort: function (what) {
        showError("The WebAssembly runtime aborted:\n" + what);
      }
    };

    canvas.addEventListener("click", function () {
      canvas.focus();
    });

    // Mouse wheel / middle-click scrolling and the context menu should not
    // interfere with the editor viewport.
    canvas.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });

    window.addEventListener("error", function (event) {
      if (event.message) {
        showError(event.message);
      }
    });
</script>

<script src="build-wasm/RTypeEditor.js"
        onerror="showError('build-wasm/RTypeEditor.js was not found.\n\nBuild the wasm target first:\n\nemcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release -DPLATFORM=Web\ncmake --build build-wasm --target RTypeEditor --parallel')"></script>
</body>
</html>
